<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>SoulFlame AR World</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:16px Arial,sans-serif;background:#f3f3ef;color:#0a0a0a}a{color:inherit;text-decoration:none}button,input{font:inherit}.wrap{width:min(1120px,calc(100% - 24px));margin:auto}.top{position:sticky;top:0;z-index:10;height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #0002;background:#f8f8f4e8;backdrop-filter:blur(14px)}.brand{font-weight:900}.hero{min-height:500px;display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:clamp(4rem,16vw,9rem);line-height:.82;letter-spacing:-.09em;margin:18px 0}.muted{color:#666;line-height:1.6}.btn{display:inline-flex;align-items:center;justify-content:center;width:max-content;padding:13px 17px;border:0;border-radius:12px;background:#090909;color:#fff;font-weight:900;cursor:pointer}.banner{margin:22px 0;padding:28px;border-radius:24px;background:#080808;color:#fff;display:grid;grid-template-columns:1fr 250px;gap:20px;align-items:center}.banner h2{font-size:clamp(2rem,6vw,4rem);letter-spacing:-.06em;margin:8px 0}.banner p{color:#bbb;line-height:1.6}.banner img{width:100%;height:220px;object-fit:cover;border-radius:18px}.echo-card{aspect-ratio:1.58;border:1px solid #fff4;border-radius:18px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,#fff2,#fff0)}.echo-card strong{font-size:38px;line-height:.9}.section{padding:52px 0}.section h2{font-size:clamp(2.2rem,7vw,4.6rem);letter-spacing:-.06em;margin:0 0 20px}.search{width:min(360px,100%);padding:13px;border:1px solid #0002;border-radius:12px;margin-bottom:18px}.cards,.planet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{min-height:205px;padding:18px;border:1px solid #0002;border-radius:20px;background:#fff;display:flex;flex-direction:column;transition:.2s transform,.2s box-shadow}.card.live{cursor:pointer}.card.live:hover{transform:translateY(-3px);box-shadow:0 15px 35px #0001}.card b{font-size:21px;margin:8px 0}.card p{margin-top:0}.tag{display:inline-flex;width:max-content;padding:5px 8px;border-radius:999px;background:#090909;color:#fff;font-size:10px;font-weight:900}.card-action{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:15px;border-top:1px solid #0001;font-weight:900}.card.live .card-action::after{content:'→';font-size:22px}.card.soon{opacity:.66}.card.soon .card-action{color:#777}.dark{min-height:100vh;background:#050505;color:#f5f5f2}.dark .top{background:#050505e8;border-color:#fff2}.dark .muted{color:#aaa}.planet{overflow:hidden;border:1px solid #fff2;border-radius:18px;background:#101010}.planet.active{outline:2px solid #fff}.planet img{width:100%;height:180px;object-fit:cover;background:#181818}.planet div{padding:14px}.planet button{width:100%;padding:11px;border:0;border-radius:10px;font-weight:900}.lab{padding:18px;border:1px solid #fff2;border-radius:18px;background:#fff1}.stage{position:relative;min-height:420px;overflow:hidden;border-radius:16px;background:radial-gradient(circle,#2c2c2c,#050505 70%)}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#999}.obj{position:absolute;top:50%;width:130px;aspect-ratio:1;object-fit:cover;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 10px 35px #000,0 0 25px #fff3}.obj.one{left:50%}.obj.left{left:34%}.obj.right{left:68%}.meteor{position:absolute;left:-35%;top:18%;width:35%;height:3px;opacity:0;background:linear-gradient(90deg,transparent,#fff)}.meteor.go{animation:meteor 1.2s forwards}@keyframes meteor{15%{opacity:1}100%{left:110%;top:78%;opacity:0}}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.notice{padding:14px;border-radius:12px;background:#fff1;color:#bbb}.error{padding:18px;border:1px solid #f665;border-radius:14px;background:#200;color:#fff}.footer{padding:45px 0;color:#777}@media(max-width:800px){.cards,.planet-grid{grid-template-columns:repeat(2,1fr)}.banner{grid-template-columns:1fr}}@media(max-width:540px){.cards,.planet-grid{grid-template-columns:1fr}.hero{min-height:430px}.stage{min-height:360px}.banner{padding:20px}}
</style>
</head>
<body><div id="app"><div class="wrap"><section class="hero"><h1>AR World</h1><p>Зареждане…</p></section></div></div>
<script>
(function(){
'use strict';
const app=document.getElementById('app');
const path=location.pathname.toLowerCase();
const IMG={mercury:'https://assets.science.nasa.gov/content/dam/science/psd/photojournal/pia/pia00/pia00437/PIA00437.jpg',venus:'https://assets.science.nasa.gov/content/dam/science/psd/photojournal/pia/pia00/pia00271/PIA00271.jpg',earth:'https://images-assets.nasa.gov/image/PIA18033/PIA18033~orig.jpg',mars:'https://assets.science.nasa.gov/content/dam/science/psd/photojournal/pia/pia00/pia00407/PIA00407.jpg',jupiter:'https://assets.science.nasa.gov/content/dam/science/psd/photojournal/pia/pia02/pia02972/PIA02972.jpg',saturn:'https://assets.science.nasa.gov/content/dam/science/psd/photojournal/pia/pia05/pia05425/PIA05425.jpg',uranus:'https://assets.science.nasa.gov/content/dam/science/psd/photojournal/pia/pia01/pia01391/PIA01391.jpg',neptune:'https://assets.science.nasa.gov/content/dam/science/psd/photojournal/pia/pia01/pia01492/PIA01492.jpg',moon:'https://assets.science.nasa.gov/content/dam/science/psd/earths-moon/outreach-materials/NASA-LRO-Moon-mosaic.png',sun:'https://assets.science.nasa.gov/content/dam/science/psd/photojournal/pia/pia26/pia26681/PIA26681.jpg',comet:'https://assets.science.nasa.gov/content/dam/science/psd/solar/2023/09/c/Comet_from_8_km.jpg',blackhole:'https://assets.science.nasa.gov/content/dam/science/psd/solar/2023/09/h/hires.jpg'};
const planets=[['mercury','Меркурий','4 879 km'],['venus','Венера','12 104 km'],['earth','Земя','12 742 km'],['mars','Марс','6 779 km'],['jupiter','Юпитер','139 820 km'],['saturn','Сатурн','116 460 km'],['uranus','Уран','50 724 km'],['neptune','Нептун','49 244 km'],['moon','Луната','3 475 km'],['sun','Слънцето','1 392 700 km'],['comet','Комета 67P','~4.1 km'],['blackhole','Черна дупка M87*','~38 млрд. km']];
const boxes=[
{title:'AR EchoCard',desc:'NFC карта, която отваря Twin профила и Echo представянето.',href:'/ar_echocard.html',tag:'№1 ПРОДУКТ'},
{title:'AR Планети',desc:'12 космически карти, камера и сцена с две тела.',href:'/ar_planeti.html',tag:'РАБОТИ'},
{title:'AR стикери',desc:'Видео, 3D обект или реклама, отключвани чрез QR/NFC.',href:'/ar_stikeri.html',tag:'РАБОТИ'},
{title:'ParkEyeRay',desc:'Навигация и свободни паркоместа в AR градската система.',href:'https://sf-parkeyeray.vercel.app',tag:'ВЪНШЕН САЙТ',external:true},
{title:'AI Twin в AR',desc:'Дигиталният двойник до теб в реалната среда.',tag:'СКОРО'},
{title:'AR мода',desc:'Виртуално пробване на SoulFlame дрехи, обувки и аксесоари.',tag:'СКОРО'},
{title:'AR градски мисии',desc:'Куестове, награди и AR обекти върху реални места.',tag:'СКОРО'},
{title:'AR обучение',desc:'3D уроци, езици, анатомия и логопедични упражнения.',tag:'СКОРО'},
{title:'AR дом',desc:'Мебели, ремонти, архитектура и имоти в реален мащаб.',tag:'СКОРО'}
];
function header(dark){return '<div class="'+(dark?'dark':'')+'"><div class="wrap"><header class="top"><a class="brand" href="/">SF · SoulFlame</a><a class="brand" href="/">AR World</a></header>'}
function end(){return '<footer class="footer">SoulFlame AR World · MVP</footer></div></div>'}
function boxHTML(x){const inside='<span class="tag">'+x.tag+'</span><b>'+x.title+'</b><p class="muted">'+x.desc+'</p><span class="card-action">'+(x.href?'Отвори':'Очаквайте скоро')+'</span>';if(!x.href)return '<article class="card soon">'+inside+'</article>';return '<a class="card live" href="'+x.href+'"'+(x.external?' target="_blank" rel="noopener"':'')+'>'+inside+'</a>'}
function home(){app.innerHTML=header(false)+'<section class="hero"><small>ПАРАЛЕЛЕН ДИГИТАЛЕН СВЯТ</small><h1>AR <strong>World</strong></h1><p class="muted">SoulFlame AR продукти, игри, услуги и AI Twin преживявания.</p><a class="btn" href="#spheres">Разгледай сферите</a></section><section class="banner"><div><small>AR ECHOCARD · NFC + TWIN</small><h2>Опознай ме с Echo картата.</h2><p>Един допир отваря Twin профила и Echo представянето.</p><a class="btn" href="/ar_echocard.html">Разгледай EchoCard</a></div><div class="echo-card"><span>NFC · TWIN ID</span><strong>ECHO<br>CARD</strong><span>ОСТАВИ СЛЕДА</span></div></section><section class="banner"><div><small>AR КОСМОС · РАБОТЕЩО DEMO</small><h2>Планетите оживяват пред теб.</h2><p>Избери до две тела, включи камерата и пусни метеорит.</p><a class="btn" href="/ar_planeti.html">Отвори AR Космос</a></div><img src="'+IMG.comet+'" alt="Комета"></section><section id="spheres" class="section"><h2>AR сфери</h2><input id="search" class="search" placeholder="Търси сфера…"><div id="cards" class="cards"></div></section>'+end();const input=document.getElementById('search'),cards=document.getElementById('cards');function draw(q){q=(q||'').toLowerCase();cards.innerHTML=boxes.filter(x=>(x.title+' '+x.desc+' '+x.tag).toLowerCase().includes(q)).map(boxHTML).join('')||'<p>Няма резултати.</p>'}input.addEventListener('input',e=>draw(e.target.value));draw('')}
function cosmos(){let selected=[];try{const parsed=JSON.parse(localStorage.getItem('sfcos')||'[]');if(Array.isArray(parsed))selected=parsed.filter(id=>planets.some(p=>p[0]===id)).slice(-2)}catch(e){try{localStorage.removeItem('sfcos')}catch(_){}selected=[]}app.innerHTML=header(true)+'<section class="hero"><small>AR КАРТИ · QR + NFC</small><h1>AR <strong>Планети</strong></h1><p class="muted">Избери до две космически тела и ги виж върху камерата.</p></section><section class="section"><h2>Космически карти</h2><div id="planetGrid" class="planet-grid"></div></section><section class="section"><div class="lab"><h2>AR камера</h2><p id="status" class="muted"></p><div class="stage"><video id="video" playsinline muted></video><div id="placeholder" class="placeholder">Камерата е изключена</div><div id="objects"></div><i id="meteor" class="meteor"></i></div><div class="row"><button class="btn" id="camera">Камера</button><button class="btn" id="shoot">Пусни метеорит</button><button class="btn" id="clear">Изчисти</button></div><p class="notice">Web-camera demo. Истински 6DoF anchor и разпознаване на физическа карта са следващият етап.</p></div></section>'+end();const grid=document.getElementById('planetGrid'),objects=document.getElementById('objects'),status=document.getElementById('status');function save(){try{localStorage.setItem('sfcos',JSON.stringify(selected))}catch(e){}}function render(){grid.innerHTML=planets.map(p=>'<article class="planet '+(selected.includes(p[0])?'active':'')+'"><img src="'+IMG[p[0]]+'" alt="'+p[1]+'"><div><small>QR + NFC CARD</small><h3>'+p[1]+'</h3><p class="muted">'+p[2]+'</p><button data-id="'+p[0]+'">'+(selected.includes(p[0])?'Активирана ✓':'Активирай')+'</button></div></article>').join('');grid.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.id;selected=selected.includes(id)?selected.filter(x=>x!==id):selected.concat(id).slice(-2);save();render()}));status.textContent=selected.length?selected.map(id=>planets.find(p=>p[0]===id)[1]).join(' + '):'Избери до две карти.';objects.innerHTML=selected.map((id,i)=>'<img class="obj '+(selected.length===1?'one':i===0?'left':'right')+'" src="'+IMG[id]+'" alt="">').join('')}document.getElementById('camera').addEventListener('click',async()=>{const ph=document.getElementById('placeholder');try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Camera API unavailable');const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const video=document.getElementById('video');video.srcObject=stream;await video.play();ph.hidden=true}catch(e){ph.hidden=false;ph.textContent='Отвори страницата в Chrome и разреши камерата.'}});document.getElementById('shoot').addEventListener('click',()=>{const m=document.getElementById('meteor');m.classList.remove('go');void m.offsetWidth;m.classList.add('go')});document.getElementById('clear').addEventListener('click',()=>{selected=[];save();render()});render()}
function stickers(){app.innerHTML=header(false)+'<section class="hero"><h1>AR <strong>стикери</strong></h1><p class="muted">Изпращаш снимка или видео. Ние го превръщаме в AR преживяване, отключвано от QR/NFC.</p></section><section class="section"><h2>Продукти</h2><div class="cards"><article class="card"><span class="tag">START</span><b>Personal AR</b><p class="muted">Лично видео или послание.</p></article><article class="card"><span class="tag">BUSINESS</span><b>AR реклама</b><p class="muted">Продукт, меню, автомобил или бранд.</p></article><article class="card"><span class="tag">3D</span><b>3D Object</b><p class="muted">Модел, герой или предмет.</p></article></div></section>'+end()}
function echo(){app.innerHTML=header(false)+'<section class="hero"><small>NFC + TWIN ID</small><h1>AR <strong>EchoCard</strong></h1><p class="muted">Опознай ме. Един допир отваря Twin профила и избраните Echo данни.</p><a class="btn" href="mailto:soulflame.mitko@gmail.com?subject=AR%20EchoCard">Заяви EchoCard</a></section>'+end()}
try{if(path.includes('ar_planeti'))cosmos();else if(path.includes('ar_stikeri'))stickers();else if(path.includes('ar_echocard'))echo();else home()}catch(e){app.innerHTML='<div class="wrap"><section class="hero"><div class="error"><h2>AR World се възстановява</h2><p>Натисни бутона, за да изчистиш локалните данни.</p><button class="btn" onclick="localStorage.clear();location.replace(\'/\')">Поправи и презареди</button></div></section></div>'}
})();
</script>
</body>
</html>
