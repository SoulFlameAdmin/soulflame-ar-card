<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1f1ee"><title>AR World — SoulFlame</title><style>:root{--x:50vw;--y:50vh;--tx:0;--ty:0;font-family:Inter,Arial,sans-serif;color:#090909;background:#f1f1ee}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;overflow-x:hidden;cursor:none;background:radial-gradient(circle at 15% 5%,#fff,transparent 30rem),linear-gradient(#f5f5f2,#e9e9e5)}a{color:inherit;text-decoration:none}.warp,.lens{position:fixed;pointer-events:none}.warp{inset:0;z-index:1;background:radial-gradient(52px 52px at var(--x) var(--y),#fff8,transparent 57%),radial-gradient(96px 96px at var(--x) var(--y),#0004,transparent 58%),radial-gradient(155px 155px at var(--x) var(--y),#fff3,transparent 67%),radial-gradient(230px 230px at var(--x) var(--y),#0002,transparent 76%);filter:grayscale(1) contrast(1.42)}.lens{left:var(--x);top:var(--y);width:clamp(76px,8vw,135px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:99;background:#fff0;border:1px solid #fff2;backdrop-filter:invert(1) grayscale(1) contrast(1.82) brightness(1.03);-webkit-backdrop-filter:invert(1) grayscale(1) contrast(1.82) brightness(1.03);box-shadow:0 7px 18px #0000000d,inset 0 0 0 1px #ffffff0d}.lens:after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;transform:translate(-50%,-50%);border-radius:50%;border:1px solid #0003}.wrap{position:relative;z-index:2;width:min(1180px,calc(100% - 32px));margin:auto}.top{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #0002;position:sticky;top:0;background:#ffffff9e;backdrop-filter:blur(18px);z-index:20}.brand{font-weight:850}.hero{min-height:590px;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid #0002;transform:perspective(1300px) rotateX(calc(var(--ty)*-1.5deg)) rotateY(calc(var(--tx)*1.5deg));transition:.14s}.hero small,.k{letter-spacing:.18em;font-weight:850;font-size:.68rem}.hero h1{font-size:clamp(4.5rem,13vw,10.5rem);line-height:.82;letter-spacing:-.09em;margin:24px 0}.hero p{max-width:650px;color:#5c5c5c;font-size:1.15rem;line-height:1.65}.btn{display:inline-flex;margin-top:28px;padding:15px 22px;border-radius:15px;background:#090909;color:#fff;font-weight:850;width:max-content}.catalog{padding:75px 0}.toolbar{display:flex;justify-content:space-between;align-items:end;gap:20px}.catalog h2{font-size:clamp(2.5rem,6vw,4.5rem);letter-spacing:-.06em;margin:.4rem 0}.search{width:min(330px,100%);padding:14px 16px;border:1px solid #0002;border-radius:14px;background:#ffffffb8}.sphere{padding:26px;margin:28px 0;border:1px solid #0002;border-radius:28px;background:#ffffffe0;box-shadow:0 18px 50px #00000016;transform:perspective(1400px) rotateX(calc(var(--ty)*-1deg)) rotateY(calc(var(--tx)*1deg));transition:.15s}.sphere h3{font-size:2rem;margin:.4rem 0 18px}.sphere .desc{color:#666;font-size:.85rem;margin:-8px 0 18px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{min-height:185px;padding:18px;border:1px solid #0002;border-radius:19px;background:#fff;display:flex;flex-direction:column;transition:.13s;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translate(var(--sx,0px),var(--sy,0px))}.card:hover{box-shadow:0 18px 35px #0002}.card b{font-size:1.05rem;margin-top:auto}.card p{font-size:.8rem;line-height:1.5;color:#5c5c5c}.icon{font-size:1.7rem}.badge{font-size:.58rem;background:#090909;color:#fff;padding:4px 7px;border-radius:999px;float:right}footer{padding:40px 0;border-top:1px solid #0002;color:#666;font-size:.72rem;display:flex;justify-content:space-between}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.toolbar{align-items:start;flex-direction:column}}@media(max-width:620px){body{cursor:auto}.lens,.warp{display:none}.grid{grid-template-columns:1fr}.hero,.sphere{transform:none}.wrap{width:calc(100% - 20px)}}</style></head><body><div class="warp"></div><div class="lens"></div><div class="wrap"><header class="top"><div class="brand">SF · SoulFlame</div><div>AR WORLD</div></header><section class="hero"><small>ПАРАЛЕЛЕН ДИГИТАЛЕН СВЯТ</small><h1>AR <strong>World</strong></h1><p>Всички SoulFlame AR продукти, игри, услуги и AI Twin преживявания — разделени в ясни сфери.</p><a class="btn" href="#catalog">Разгледай сферите</a></section><main id="catalog" class="catalog"><div class="toolbar"><div><span class="k">SOULFLAME ECOSYSTEM</span><h2>AR сфери</h2></div><input id="q" class="search" placeholder="Търси AR продукт..."></div><div id="spheres"></div></main><footer><span>SOULFLAME AR WORLD</span><span>Физическият свят получава дигитален слой.</span></footer></div><script>const D=[['AR продукти и реклама','Физически предмети, които оживяват през камера, QR код или AR очила.',[['AR карти','▣','Картички, визитки и колекционерски карти с видео и 3D.'],['AR стикери','◫','Стикери, които отварят закрепена AR сцена.'],['AR реклами','◎','Интерактивни кампании върху реални обекти.'],['AR плакати','▤','Плакати, които оживяват през камерата.'],['AR опаковки','◈','Продуктова информация и 3D демонстрации.'],['AR дрехи','♙','Дрехи с дигитален слой и анимации.'],['AR подаръци','◇','Персонални AR послания и спомени.'],['AR менюта','☷','3D храна и интерактивно меню.']]],['AR игри','Реалният свят става игрално поле. Мисии, герои и събития се появяват около теб.',[['AR лов','⌖','Мисии и предмети в реалния град.'],['AR битки','⚡','Персонажи и ефекти в реална среда.'],['AR пъзели','◫','Пространствени загадки и портали.'],['AR спорт','◎','Игрови предизвикателства и класации.'],['AR турнир','♜','Събития между хора и отбори.'],['AR домашни игри','⌂','Игри, които превръщат стаята в сцена.']]],['AR фризьор и красота','Визуална проба на прическа, цвят и стил преди реалната промяна.',[['AR прически','✂','Пробваш форма и дължина върху главата си.'],['AR цвят за коса','◐','Реалистична смяна на цвета.'],['AR брада','⌇','Форма и контур преди подстригване.'],['AR грим','✣','Виртуален грим в реално време.'],['AR нокти','◈','Цветове, форми и дизайни върху ръцете.'],['AR салон','⌂','Избор на услуга и записване на час.']]],['AR мода и пазаруване','Пробваш продукти в реален мащаб, без физически да ги обличаш.',[['AR дрехи','♙','Виртуално пробване на цялостни визии.'],['AR обувки','◒','Поставяне върху крака в реален размер.'],['AR очила','∞','Пробване на рамки и AR очила.'],['AR бижута','◊','Часовници, пръстени и аксесоари.'],['AR магазин','▦','Дигитален шоурум във всяка стая.'],['AR размер','↔','AI препоръка на точния размер.']]],['AR град, карта и навигация','Дигитален слой върху града — посока, паркиране и локални услуги.',[['AR навигация','➤','Стрелка пред теб според движението.'],['ParkEyeRay','P','Свободни паркоместа в реално време.'],['AR места','⌖','Информация върху сгради и локации.'],['AR оферти','%','Локални оферти върху реални обекти.'],['AR транспорт','⇢','Маршрути и време на пристигане.'],['AR безопасност','△','Предупреждения за опасности и трафик.']]],['AI Twins в AR','Дигиталният двойник присъства до теб и взаимодейства със света.',[['AR AI Twin','◉','Твоят AI двойник присъства в пространството.'],['Twin асистент','✦','Показва следващата стъпка върху обекта.'],['AR приятели','⌘','Аватари и статус около теб.'],['Жест за свързване','∞','Общ жест създава връзка в AR World.'],['AR разговори','◌','3D присъствие на друг човек.'],['Twin памет','⌁','Спомени и бележки на точното място.']]],['AR дом и архитектура','Планиране на пространство в реален мащаб преди покупка или ремонт.',[['AR мебели','▱','Мебели в реален мащаб.'],['AR ремонт','⌂','Материали и настилки преди ремонт.'],['AR архитектура','△','Бъдеща сграда върху терена.'],['AR имоти','▦','Интерактивни огледи и планове.'],['AR инструкции','☷','Монтажни стъпки върху частите.']]],['AR обучение','Сложната информация става интерактивен пространствен модел.',[['AR уроци','◫','3D модели върху учебника.'],['AR анатомия','◎','Интерактивен модел на тялото.'],['AR езици','A','Думи и превод върху предметите.'],['AR професии','⚙','Практически симулации.'],['AR логопедия','◍','Игрови артикулационни упражнения.']]],['AR автомобили и техника','Информация, диагностика и конфигурация директно върху машината.',[['AR автомобил','▰','Данни и функции върху автомобила.'],['AR диагностика','⚙','Открива частта и вероятния проблем.'],['AR ремонт','⌁','Стъпки върху двигателя.'],['AR конфигуратор','◐','Цветове, джанти и интериор.'],['AR шофиране','➤','Навигация и предупреждения.']]],['AR събития и развлечения','Концерти, спорт, музеи и лични събития с интерактивен слой.',[['AR концерти','♫','Сценични ефекти и аватари.'],['AR музеи','▥','Истории и реконструкции.'],['AR спорт','◎','Статистика върху събитието.'],['AR покани','✉','Покана с видео или 3D сцена.'],['AR спомени','◇','Медия, закрепена към място.']]],['AR бизнес и индустрия','Инструменти за продажби, обучение, поддръжка и работа.',[['AR презентации','▤','3D продукт пред клиента.'],['AR инструкции','☷','Работни стъпки върху оборудването.'],['AR склад','▦','Оптимален маршрут до продукта.'],['AR строителство','△','Планове и размери върху обекта.'],['AR дистанционна помощ','◌','Експерт маркира решението.'],['AR анализи','⌁','Резултати от AR кампании.']]],['AR Creator Studio','Създаване, публикуване и продажба на съдържание за AR World.',[['Photo to 3D','◫','Снимка се превръща в 3D модел.'],['AR редактор','✣','Позиция, мащаб, анимация и звук.'],['QR генератор','▦','Вход към AR сцена или продукт.'],['AR anchors','⌖','Закрепване към образ, стая или GPS.'],['AR Marketplace','◇','Пазар за AR модели и преживявания.'],['AR профил','◉','Портфолио за създатели и брандове.']]]];const R=document.getElementById('spheres'),Q=document.getElementById('q');function render(q=''){q=q.toLowerCase();R.innerHTML=D.map((s,i)=>{const a=s[2].filter(x=>(s[0]+s[1]+x.join(' ')).toLowerCase().includes(q));if(!a.length)return'';return`<section class="sphere"><small>СФЕРА ${String(i+1).padStart(2,'0')}</small><h3>${s[0]}</h3><p class="desc">${s[1]}</p><div class="grid">${a.map((x,j)=>`<article class="card"><div><span class="icon">${x[1]}</span>${i===0&&j<3?'<span class="badge">ПРИОРИТЕТ</span>':''}</div><b>${x[0]}</b><p>${x[2]}</p></article>`).join('')}</div></section>`}).join('')}Q.oninput=e=>render(e.target.value);render();let mx=innerWidth/2,my=innerHeight/2,p=0;function tick(){p=0;let r=document.documentElement;r.style.setProperty('--x',mx+'px');r.style.setProperty('--y',my+'px');let ox=(mx-innerWidth/2)/(innerWidth/2),oy=(my-innerHeight/2)/(innerHeight/2);r.style.setProperty('--tx',(ox*5.4).toFixed(2));r.style.setProperty('--ty',(oy*5.4).toFixed(2));document.querySelectorAll('.card').forEach(c=>{let b=c.getBoundingClientRect(),dx=mx-(b.left+b.width/2),dy=my-(b.top+b.height/2),d=Math.hypot(dx,dy),f=Math.max(0,1-d/180);c.style.setProperty('--ry',((dx/b.width)*8*f).toFixed(2)+'deg');c.style.setProperty('--rx',((-dy/b.height)*8*f).toFixed(2)+'deg');c.style.setProperty('--sx',((dx/b.width)*8*f).toFixed(2)+'px');c.style.setProperty('--sy',((dy/b.height)*8*f).toFixed(2)+'px')})}addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;if(!p){p=1;requestAnimationFrame(tick)}});tick();</script></body></html>
