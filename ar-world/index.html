<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoulFlame AR World</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:16px Arial;background:#f1f1ee;color:#090909}a{color:inherit;text-decoration:none}.w{width:min(1160px,calc(100% - 24px));margin:auto}.top{height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #0002;position:sticky;top:0;background:#f8f8f5df;backdrop-filter:blur(14px);z-index:9}.hero{min-height:520px;display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:clamp(4rem,13vw,9rem);line-height:.82;letter-spacing:-.09em;margin:18px 0}.muted{color:#666;line-height:1.65}.btn{display:inline-flex;padding:13px 17px;border-radius:12px;background:#090909;color:#fff;font-weight:800;border:0}.bn{margin:24px 0;padding:30px;border-radius:25px;background:#090909;color:#fff;display:grid;grid-template-columns:1fr 250px;gap:24px;align-items:center}.bn h2{font-size:clamp(2rem,5vw,4rem);letter-spacing:-.06em;margin:10px 0}.bn p{color:#bbb;line-height:1.55}.bn img{width:100%;height:220px;object-fit:cover;border-radius:16px}.cardpic{aspect-ratio:1.58;border:1px solid #fff4;border-radius:18px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,#fff2,#fff0)}.cat{padding:55px 0}.cat h2{font-size:clamp(2.3rem,6vw,4rem);letter-spacing:-.05em}.search{padding:12px;border:1px solid #0002;border-radius:12px;width:min(330px,100%)}.sphere{margin:18px 0;padding:20px;border:1px solid #0002;border-radius:22px;background:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.box{min-height:145px;padding:15px;border:1px solid #0002;border-radius:15px;background:#fafafa;display:flex;flex-direction:column}.box b{margin-top:auto}.box p{font-size:12px;color:#666}.tag{font-size:9px;background:#090909;color:#fff;border-radius:20px;padding:4px 7px;width:max-content}.space{background:#050505;color:#f5f5f2;min-height:100vh}.space .top{background:#050505dd;border-color:#fff2}.space .muted{color:#aaa}.space .hero{display:grid;grid-template-columns:1fr .8fr;gap:30px}.orb{display:grid;place-items:center;position:relative}.orb img{width:210px;height:210px;border-radius:50%;object-fit:cover;box-shadow:0 0 70px #fff4}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.steps article,.lab{padding:18px;border:1px solid #fff2;border-radius:18px;background:#fff1}.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.cos{border:1px solid #fff2;border-radius:18px;overflow:hidden;background:#0d0d0d}.cos.on{border-color:#fff}.cos img{width:100%;height:190px;object-fit:cover}.cos div{padding:14px}.cos p{color:#999;font-size:12px}.cos button{width:100%;padding:10px;border:0;border-radius:9px;font-weight:800}.stage{position:relative;min-height:430px;overflow:hidden;border-radius:16px;background:radial-gradient(circle,#292929,#050505 70%)}video{position:absolute;width:100%;height:100%;object-fit:cover}.ph{position:absolute;inset:0;display:grid;place-items:center;color:#888}.obj{position:absolute;left:var(--l);top:var(--t);width:var(--s);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;object-fit:cover;box-shadow:0 10px 35px #000,0 0 20px #fff2}.met{position:absolute;left:-30%;top:12%;width:35%;height:3px;opacity:0;background:linear-gradient(90deg,transparent,#fff)}.met.go{animation:m 1.2s forwards}@keyframes m{15%{opacity:1}100%{left:110%;top:78%;opacity:0}}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.prod{padding:18px;border:1px solid #0002;border-radius:19px;background:#fff;min-height:250px;display:flex;flex-direction:column}.prod b{margin-top:auto;font-size:20px}@media(max-width:800px){.bn,.space .hero{grid-template-columns:1fr}.grid,.cg,.shop{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid,.cg,.shop,.steps{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script>const A=document.getElementById('app'),P=location.pathname;const IMG={Me:'https://assets.science.nasa.gov/content/dam/science/psd/photojournal/pia/pia00/pia00437/PIA00437.jpg',V:'https://assets.science.nasa.gov/content/dam/science/psd/photojournal/pia/pia00/pia00271/PIA00271.jpg',E:'https://images-assets.nasa.gov/image/PIA18033/PIA18033~orig.jpg',Ma:'https://assets.science.nasa.gov/content/dam/science/psd/photojournal/pia/pia00/pia00407/PIA00407.jpg',J:'https://assets.science.nasa.gov/content/dam/science/psd/photojournal/pia/pia02/pia02972/PIA02972.jpg',S:'https://assets.science.nasa.gov/content/dam/science/psd/photojournal/pia/pia05/pia05425/PIA05425.jpg',U:'https://assets.science.nasa.gov/content/dam/science/psd/photojournal/pia/pia01/pia01391/PIA01391.jpg',N:'https://assets.science.nasa.gov/content/dam/science/psd/photojournal/pia/pia01/pia01492/PIA01492.jpg',Mo:'https://assets.science.nasa.gov/content/dam/science/psd/earths-moon/outreach-materials/NASA-LRO-Moon-mosaic.png',Su:'https://assets.science.nasa.gov/content/dam/science/psd/photojournal/pia/pia26/pia26681/PIA26681.jpg',C:'https://assets.science.nasa.gov/content/dam/science/psd/solar/2023/09/c/Comet_from_8_km.jpg',B:'https://assets.science.nasa.gov/content/dam/science/psd/solar/2023/09/h/hires.jpg'};function top(space=0){return`<div class="${space?'space':''}"><div class="w"><header class="top"><a href="/"><b>SF · SoulFlame</b></a><a href="/"><b>AR World</b></a></header>`}function end(){return'</div></div>'}const S=[['AR продукти и реклама',[['AR EchoCard','NFC Twin + Echo представяне','/ar_echocard.html','№1'],['AR Планети','12 космически карти с QR + NFC','/ar_planeti.html','ПРИОРИТЕТ'],['AR карти','Видео, 3D и колекционерски карти'],['AR стикери','Персонални AR сцени','/ar_stikeri.html']]],['AR игри',[['AR Космос','Две карти в обща сцена + метеорит','/ar_planeti.html','НОВО'],['AR градски мисии','Куестове върху реални места'],['AR лов','Предмети и награди'],['AR PvP','Битки в реална среда']]],['AR фризьор',[['AR прически','Пробваш стил'],['AR цвят','Смяна на коса'],['AR брада','Форма и контур'],['AR грим','Виртуална визия']]],['AR мода',[['AR дрехи','Виртуално пробване'],['AR обувки','Модел върху крака'],['AR очила','Пробване на рамки'],['AR бижута','Аксесоари']]],['AR град',[['AR навигация','Стрелка по посоката'],['ParkEyeRay','Свободни паркоместа'],['AR места','Информация за локации'],['AR оферти','Локални промоции']]],['AI Twins в AR',[['AR AI Twin','Двойникът до теб'],['Twin асистент','Следваща стъпка'],['AR приятели','Аватари и статус'],['Жест за връзка','Взаимно приятелство']]],['AR дом',[['AR мебели','Реален размер'],['AR ремонт','Материали'],['AR архитектура','Сграда върху терена'],['AR имоти','Огледи']]],['AR обучение',[['AR уроци','3D модели'],['AR анатомия','Тяло'],['AR езици','Превод'],['AR логопедия','Упражнения']]],['AR автомобили',[['AR автомобил','Данни върху колата'],['AR диагностика','Проблем'],['AR ремонт','Инструкции'],['AR конфигуратор','Цветове']]]];function home(){A.innerHTML=top()+`<section class="hero"><small>ПАРАЛЕЛЕН ДИГИТАЛЕН СВЯТ</small><h1>AR <strong>World</strong></h1><p class="muted">SoulFlame AR продукти, игри, услуги и AI Twin преживявания.</p><a class="btn" href="#cat">Разгледай сферите</a></section><section class="bn"><div><small>AR ECHOCARD · NFC + TWIN</small><h2>Опознай ме с Echo картата.</h2><p>Един допир отваря Twin профила и Echo представянето.</p><a class="btn" href="/ar_echocard.html">Разгледай</a></div><div class="cardpic"><span>NFC · TWIN ID</span><b style="font-size:38px">ECHO<br>CARD</b><span>ОСТАВИ СЛЕДА</span></div></section><section class="bn"><div><small>ОЧАКВАЙТЕ СКОРО · AR КОСМОС</small><h2>Вижте метеорит в AR.</h2><p>Избери планета, отвори камерата, активирай две карти и пусни метеорит между тях.</p><a class="btn" href="/ar_planeti.html">Избери карта</a></div><img src="${IMG.C}"></section><main id="cat" class="cat"><h2>AR сфери</h2><input id="q" class="search" placeholder="Търси..."><div id="r"></div></main>`+end();const r=document.getElementById('r'),q=document.getElementById('q');function d(v=''){v=v.toLowerCase();r.innerHTML=S.map(s=>{let x=s[1].filter(i=>(s[0]+i.join(' ')).toLowerCase().includes(v));return x.length?`<section class="sphere"><h3>${s[0]}</h3><div class="grid">${x.map(i=>`${i[2]?`<a href="${i[2]}" class="box">`:'<article class="box">'}${i[3]?`<span class="tag">${i[3]}</span>`:''}<b>${i[0]}</b><p>${i[1]}</p>${i[2]?'</a>':'</article>'}`).join('')}</div></section>`:''}).join('')}q.oninput=e=>d(e.target.value);d()}const B=[['me','Меркурий',4879,'4 879 km',IMG.Me,'NASA / Mariner 10'],['v','Венера',12104,'12 104 km',IMG.V,'NASA/JPL / Magellan'],['e','Земя',12742,'12 742 km',IMG.E,'NASA / Suomi NPP'],['ma','Марс',6779,'6 779 km',IMG.Ma,'NASA / Viking'],['j','Юпитер',139820,'139 820 km',IMG.J,'NASA / Cassini'],['s','Сатурн',116460,'116 460 km',IMG.S,'NASA / Cassini'],['u','Уран',50724,'50 724 km',IMG.U,'NASA / Voyager 2'],['n','Нептун',49244,'49 244 km',IMG.N,'NASA / Voyager 2'],['mo','Луната',3475,'3 475 km',IMG.Mo,'NASA / LRO'],['su','Слънцето',1392700,'1 392 700 km',IMG.Su,'NASA / SDO'],['c','Комета 67P',4.1,'~4.1 km',IMG.C,'ESA / Rosetta'],['b','Черна дупка M87*',38e9,'~38 млрд. km',IMG.B,'Event Horizon Telescope']];let sel=JSON.parse(localStorage.getItem('sfcos')||'[]').slice(-2),mode=0,stream;function cosmos(){A.innerHTML=top(1)+`<section class="hero"><div><small>AR КАРТИ · QR + NFC</small><h1>AR <strong>Планети</strong></h1><p class="muted">Картата е ключ за активация. След разпознаването моделът остава в сцената; за ново стартиране активираш картата пак.</p><a class="btn" href="#cards">Избери карта</a></div><div class="orb"><img src="${IMG.Su}"></div></section><section class="steps"><article><b>01 · KEY</b><p>QR + NFC отключва модела.</p></article><article><b>02 · ANCHOR</b><p>Моделът се стабилизира към средата.</p></article><article><b>03 · 2 КАРТИ</b><p>Двете тела са заедно и пускаш метеорит.</p></article></section><main id="cards" class="cat"><h2>Космически карти</h2><div id="cg" class="cg"></div><section class="lab"><h2>AR камера</h2><p id="st" class="muted"></p><div class="stage"><video id="vid" playsinline muted></video><div id="ph" class="ph">Камерата е изключена</div><div id="lay"></div><i id="met" class="met"></i></div><div class="row"><button class="btn" id="cam">Камера</button><button class="btn" id="md">Видим мащаб</button><button class="btn" id="shot">Пусни метеорит</button><button class="btn" id="cl">Изчисти</button></div><p class="muted">Това е работещ web camera demo. Истински постоянен 6DoF world anchor и автоматично разпознаване на target ще използват WebXR/ARCore/ARKit.</p></section></main>`+end();renderCards();document.getElementById('cam').onclick=camera;document.getElementById('md').onclick=e=>{mode=!mode;e.target.textContent=mode?'Реално съотношение':'Видим мащаб';scene()};document.getElementById('shot').onclick=()=>{let m=document.getElementById('met');m.classList.remove('go');void m.offsetWidth;m.classList.add('go')};document.getElementById('cl').onclick=()=>{sel=[];localStorage.removeItem('sfcos');renderCards();scene()};scene()}function renderCards(){let g=document.getElementById('cg');g.innerHTML=B.map(b=>`<article class="cos ${sel.includes(b[0])?'on':''}"><img src="${b[4]}"><div><small>QR + NFC CARD</small><h3>${b[1]}</h3><p>${b[5]} · ${b[3]}</p><button onclick="tog('${b[0]}')">${sel.includes(b[0])?'Активирана ✓':'Активирай'}</button></div></article>`).join('')}function tog(id){sel=sel.includes(id)?sel.filter(x=>x!=id):[...sel,id].slice(-2);localStorage.setItem('sfcos',JSON.stringify(sel));renderCards();scene()}function scene(){let x=sel.map(id=>B.find(b=>b[0]==id)),mx=Math.max(...x.map(b=>b[2]),1),lay=document.getElementById('lay');if(!lay)return;document.getElementById('st').textContent=x.length?x.map(b=>b[1]).join(' + '):'Избери до две карти.';lay.innerHTML=x.map((b,i)=>{let z=mode?Math.max(3,230*b[2]/mx):70+(Math.log10(b[2])-0.6)/10*140;return`<img class="obj" src="${b[4]}" style="--s:${z}px;--l:${x.length==1?50:i?68:33}%;--t:${i?58:48}%">`}).join('')}async function camera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});let v=document.getElementById('vid');v.srcObject=stream;await v.play();document.getElementById('ph').hidden=true}catch(e){document.getElementById('ph').textContent='Разреши достъп до камерата.'}}function stickers(){let p=[['AR Car Video Sticker','Видео за кола, автокъща или бранд','39.90 €'],['Personal Video Sticker','Лично видео и послание','19.90 €'],['3D Object Sticker','3D продукт или герой','29.90 €'],['Business Pack','10 стикера + AR сцена','69 €'],['AR Wear Labels','25 AR етикета','99 €'],['Custom AR','Индивидуално преживяване','249 €']];A.innerHTML=top()+`<section class="hero"><h1>AR <strong>стикери</strong></h1><p class="muted">Физически стикери, които отключват видео, 3D, профил или реклама.</p></section><main class="cat"><h2>Избери продукт</h2><div class="shop">${p.map(x=>`<article class="prod"><h3>${x[0]}</h3><p class="muted">${x[1]}</p><b>${x[2]}</b></article>`).join('')}</div></main>`+end()}function echo(){A.innerHTML=top()+`<section class="hero"><h1>AR <strong>EchoCard</strong></h1><p class="muted">NFC карта, която отваря избраните от теб Twin и Echo данни. Един допир — истинско представяне.</p><a class="btn" href="mailto:soulflame.mitko@gmail.com?subject=AR EchoCard">Заяви EchoCard</a></section>`+end()}P.includes('ar_planeti')?cosmos():P.includes('ar_stikeri')?stickers():P.includes('ar_echocard')?echo():home()</script></body></html>
