<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR стикери — SoulFlame</title><style>:root{font-family:Inter,Arial,sans-serif;color:#090909;background:#f2f2ef}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f5f5f2,#e9e9e5);min-height:100vh}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.top{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #0002;position:sticky;top:0;background:#ffffffb0;backdrop-filter:blur(18px);z-index:20}.top a{color:inherit;text-decoration:none;font-weight:800}.hero{padding:90px 0 70px;border-bottom:1px solid #0002}.hero small,.k{letter-spacing:.18em;font-weight:850;font-size:.68rem}.hero h1{font-size:clamp(4rem,11vw,8rem);line-height:.85;letter-spacing:-.08em;margin:24px 0}.hero p{max-width:680px;color:#5b5b5b;font-size:1.1rem;line-height:1.65}.shop{padding:70px 0}.shop h2{font-size:clamp(2.4rem,6vw,4rem);letter-spacing:-.05em}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.product{background:#fff;border:1px solid #0002;border-radius:22px;padding:20px;min-height:280px;display:flex;flex-direction:column}.mock{height:120px;border-radius:16px;background:radial-gradient(circle at 35% 25%,#fff,#deded9 45%,#aaa);display:grid;place-items:center;font-size:3rem;margin-bottom:20px}.product h3{font-size:1.25rem;margin:0 0 8px}.product p{color:#666;font-size:.86rem;line-height:1.5}.bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:center}.price{font-size:1.25rem;font-weight:900}.add{border:0;border-radius:12px;background:#090909;color:#fff;padding:11px 14px;font-weight:800;cursor:pointer}.cartbar{position:fixed;right:20px;bottom:20px;background:#090909;color:#fff;border-radius:16px;padding:14px 18px;font-weight:800;box-shadow:0 16px 40px #0004}.panel{position:fixed;right:20px;bottom:82px;width:min(390px,calc(100% - 40px));max-height:65vh;overflow:auto;background:#fff;border:1px solid #0002;border-radius:22px;padding:20px;box-shadow:0 25px 70px #0004;display:none}.panel.open{display:block}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #0001}.order{width:100%;border:0;border-radius:13px;background:#090909;color:#fff;padding:14px;font-weight:850;margin-top:14px}.empty{color:#777}.back{display:inline-block;margin-bottom:20px;color:#555;text-decoration:none}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.grid{grid-template-columns:1fr}.wrap{width:calc(100% - 20px)}}</style></head><body><div class="wrap"><header class="top"><a href="index.html">SF · SoulFlame</a><a href="index.html">AR World</a></header><section class="hero"><a class="back" href="index.html">← Назад към AR World</a><small>ПЪРВИЯТ SOULFLAME AR ПРОДУКТ</small><h1>AR <strong>стикери</strong></h1><p>Физически стикер, който отключва видео, 3D обект, анимация, меню, профил или персонално послание през камерата.</p></section><main class="shop"><span class="k">AR STICKER SHOP</span><h2>Избери стикер</h2><div id="grid" class="grid"></div></main></div><button id="cartbtn" class="cartbar">Количка · <span id="count">0</span></button><aside id="panel" class="panel"><h2>Твоята поръчка</h2><div id="items"></div><h3>Общо: <span id="total">0 €</span></h3><button id="order" class="order">Поръчай</button></aside><script>const P=[['AR Video Sticker','🎬','Видео върху стикера','19 €'],['AR 3D Sticker','🧊','3D обект или продукт','29 €'],['AR Business Sticker','◈','Лого, оферта и контакти','24 €'],['AR Memory Sticker','◇','Снимки, видео и послание','22 €'],['AR Menu Sticker','☷','Интерактивно меню','29 €'],['AR Clothing Sticker','♙','AR слой за дреха','35 €']];let cart=[];const G=document.getElementById('grid'),I=document.getElementById('items'),C=document.getElementById('count'),T=document.getElementById('total'),N=n=>Number(n.replace(' €',''));G.innerHTML=P.map((p,i)=>`<article class="product"><div class="mock">${p[1]}</div><h3>${p[0]}</h3><p>${p[2]}</p><div class="bottom"><span class="price">${p[3]}</span><button class="add" onclick="add(${i})">Добави</button></div></article>`).join('');function add(i){cart.push(i);draw()}function draw(){C.textContent=cart.length;I.innerHTML=cart.length?cart.map((i,n)=>`<div class="row"><span>${P[i][0]}</span><b>${P[i][3]}</b><button onclick="del(${n})">×</button></div>`).join(''):'<p class="empty">Количката е празна.</p>';T.textContent=cart.reduce((s,i)=>s+N(P[i][3]),0)+' €'}function del(n){cart.splice(n,1);draw()}document.getElementById('cartbtn').onclick=()=>document.getElementById('panel').classList.toggle('open');document.getElementById('order').onclick=()=>{if(!cart.length)return;let body='Здравейте, искам да поръчам:%0A'+cart.map(i=>'- '+P[i][0]+' ('+P[i][3]+')').join('%0A')+'%0AОбщо: '+T.textContent;location.href='mailto:?subject=SoulFlame AR Sticker Order&body='+body};draw();</script></body></html>
